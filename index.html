<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TRẠM ĐĂNG BÀI • PHÚC HỌC ĐIỀU HAY</title>
  <link rel="icon" type="image/png" href="Avatar.png">
  <link rel="apple-touch-icon" href="Avatar.png">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-inner: #0b1120;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #f59e0b;
      --emerald: #10b981;
      --cyan: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 560px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; }
    
    /* HEADER */
    header { background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, rgba(19, 27, 46, 0) 100%); padding: 16px; text-align: center; border-bottom: 1px solid var(--border); }
    .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .brand-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .header-title { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-subtitle { font-size: 11.5px; color: var(--text-muted); }
    
    /* 2 TAB SWITCHER */
    .tab-switcher { display: grid; grid-template-columns: 1fr 1fr; background: #090d16; margin: 12px 16px 4px 16px; border-radius: 14px; padding: 4px; border: 1px solid var(--border); gap: 6px; }
    .tab-btn { border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 800; padding: 11px 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
    .tab-btn.tab-img.active { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35); }
    
    /* STATS */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; font-size: 12px; color: var(--text-muted); }
    .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); width: 0%; transition: width 0.3s; }
    
    /* CURRENT CARD */
    .current-card { margin: 10px 16px; background: var(--card-inner); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .current-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .badge-stt { font-size: 12px; font-weight: 900; background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-score { font-size: 12px; font-weight: 900; background: rgba(6, 182, 212, 0.2); color: #22d3ee; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(6, 182, 212, 0.35); }
    .badge-status { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; }
    .badge-status.pending { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }
    .badge-status.done { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-status.ready { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.35); }
    
    .current-title { font-size: 15px; font-weight: 800; color: #fff; line-height: 1.4; }
    
    .media-preview-box { background: #060911; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative; }
    .media-preview-box img { width: 100%; max-height: 280px; object-fit: contain; cursor: zoom-in; }
    
    /* BUTTONS */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 8px 16px; }
    .btn { border: none; border-radius: 12px; padding: 12px 10px; font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .btn-drive { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border); }
    .btn-drive:hover { background: rgba(255,255,255,0.15); }
    .btn-next { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
    .btn-done-toggle { grid-column: span 2; background: rgba(255, 255, 255, 0.05); color: #94a3b8; border: 1px solid var(--border); }
    .btn-done-toggle.is-done { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.4); }
    
    /* COPY GRID */
    .copy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 14px 16px; }
    .btn-copy { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.25); color: #fbbf24; border-radius: 12px; padding: 11px 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; }
    .btn-copy:active { background: var(--primary); color: #000; transform: scale(0.97); }
    .btn-copy.btn-fb { grid-column: span 2; background: rgba(24, 119, 242, 0.18); border-color: rgba(24, 119, 242, 0.45); color: #60a5fa; font-weight: 800; }
    .btn-copy.btn-pinned { grid-column: span 2; background: rgba(168, 85, 247, 0.18); border-color: rgba(168, 85, 247, 0.4); color: #c084fc; }
    
    /* LIST SECTION */
    .list-section { padding: 12px 16px 16px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: rgba(11, 17, 32, 0.4); }
    .search-input { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #fff; outline: none; }
    .filter-chips { display: flex; gap: 6px; }
    .filter-chip { background: #090d16; border: 1px solid var(--border); color: var(--text-muted); font-size: 11px; padding: 5px 10px; border-radius: 20px; cursor: pointer; }
    .filter-chip.active { background: var(--primary); color: #000; font-weight: 800; border-color: var(--primary); }
    .table-container { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th { background: #090d16; padding: 8px; text-align: left; color: var(--text-muted); position: sticky; top: 0; }
    td { padding: 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
    tr.active { background: rgba(245, 158, 11, 0.15); }
    tr:hover { background: rgba(255,255,255,0.03); }
    
    /* TOAST */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #10b981; color: #000; font-weight: 800; font-size: 13px; padding: 10px 20px; border-radius: 20px; z-index: 999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    
    /* LIGHTBOX */
    .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand-wrap">
        <img src="Avatar.png" class="brand-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23f59e0b\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'>PH</text></svg>'">
        <div>

    <div class="stats-bar">
      <span id="statText">Đang tải...</span>

    <div class="current-card">
      <div class="current-header">
        <span class="badge-stt" id="currStt">#1</span>
        <span class="badge-score" id="currScore" style="display:none;">⭐ 9.8</span>

    <!-- COPY BUTTONS GRID (Được render động theo Tab) -->
    <div class="copy-grid" id="copyGrid"></div>

    <!-- LIST & SEARCH -->
    <div class="list-section">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm kiếm chủ đề..." oninput="renderTable()">
      <div class="filter-chips">
        <button class="filter-chip active" onclick="setFilter('all', this)">Tất cả</button>
        <button class="filter-chip" onclick="setFilter('pending', this)">Chưa đăng</button>
        <button class="filter-chip" onclick="setFilter('done', this)">Đã đăng</button>

      <div class="table-container">
        <table id="dataTable">
          <thead><tr><th>#</th><th>Tiêu đề</th><th>Trạng thái</th></tr></thead>

  <script>
    var VIDEO_ITEMS = [{"stt":1,"category":"Phúc học cách sống","title":"Biết cúi đầu xin lỗi khi mình làm sai","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1Y7SoVQrTdExDcTidO_g3tTWHXN-Zv4_m/view?usp=drivesdk","youtubeTitle":"Dạy Trẻ Biết Xin Lỗi Khi Làm Sai: Bài Học Về Sự Dũng Cảm Và Trung Thực | #phuchocdieuhay","youtubeDesc":"Trong cuộc sống, ai cũng có lúc mắc sai lầm. Thay vì trốn tránh hay đổ lỗi, hãy dạy con cách dũng cảm đối diện và nói lời xin lỗi chân thành. Video từ kênh Phúc Học Điều Hay gửi gắm thông điệp về sự trung thực và trách nhiệm. Biết nhận lỗi không làm con thấp kém, mà giúp con trưởng thành và đáng tin cậy hơn. Mong rằng cha mẹ sẽ cùng con lan tỏa sự tử tế này. Hãy nhấn Subscribe để cùng con học thêm nhiều điều hay mỗi ngày nhé!\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","tiktok":"Xin lỗi không làm con thấp kém, đó là bản lĩnh! Cha mẹ xem ngay để cùng con học bài học về sự dũng cảm và trung thực nhé. #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","facebook":"Dạy con biết nhận lỗi là dạy con lòng dũng cảm. Lời xin lỗi chân thành giúp chữa lành mọi tổn thương và giữ trọn niềm tin. #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Con ơi, biết nhận lỗi khi sai là con đang sống trung thực và dũng cảm. Lời xin lỗi đúng lúc là liều thuốc chữa lành mọi lỗi lầm. #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","instagram":"Sự chân thành bắt đầu từ lời xin lỗi. Hãy dạy con biết cúi đầu đúng lúc để nhận lại sự bao dung và niềm tin từ mọi người. ✨ #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","pinnedComment":"Ba mẹ thường dạy bé nói lời xin lỗi như thế nào khi làm sai? Hãy cùng chia sẻ câu chuyện của gia đình mình để lan tỏa bài học hay này nhé! ❤️"},{"stt":2,"category":"Phúc học cách sống","title":"Phúc học cách sống — Thật thà là gốc rễ của danh dự","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/16ypEAmltPF120x3zKlnWxqa7eryd7qSW/view?usp=drivesdk","youtubeTitle":"Thật Thà Là Gốc Rễ Của Danh Dự: Bài Học Dạy Con Sống Trung Thực | Phúc Học Điều Hay #phuchocdieuhay","youtubeDesc":"Sự thật thà chính là món quà quý giá nhất mà mẹ muốn con luôn mang theo bên mình. Một lời nói dối có thể giúp con thoát tội nhất thời, nhưng sẽ lấy đi sự tin tưởng - thứ vốn mỏng manh như tờ giấy trắng, đã vò nát thì khó lòng làm phẳng lại. Qua video này, Phúc Học Điều Hay hy vọng cha mẹ và các con sẽ thấu hiểu: Trung thực không chỉ là không nói dối, mà là dũng cảm đối diện với lỗi lầm để giữ gìn danh dự bản thân. Hãy nhấn Subscribe để cùng con học thêm nhiều điều hay mỗi ngày nhé!\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","tiktok":"Một lời nói dối nhỏ có thể làm mất đi niềm tin mãi mãi. Cùng con học bài học về sự thật thà để trưởng thành tử tế hơn mỗi ngày! #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","facebook":"Sự thật thà là món quà quý giá mẹ mong con giữ lấy. Đừng vì sợ hãi mà đánh mất niềm tin, bởi danh dự mới là gốc rễ của con người. #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Con ơi, hãy sống thật thà để lòng bình yên và nhận được sự nể trọng. Trung thực chính là gốc rễ làm nên một con người tử tế. #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","instagram":"Thật thà là gốc rễ của danh dự. Hãy dạy con sự trung thực để nhận lấy nể trọng và yêu mến từ mọi người xung quanh. #phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","pinnedComment":"Bố mẹ thường làm gì khi phát hiện con nói dối? Hãy cùng chia sẻ cách giáo dục con sự trung thực ở dưới bình luận này nhé!"},{"stt":3,"category":"Phúc học cách sống","title":"Biết nói lời cảm ơn từ những điều nhỏ bé nhất","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1fnzdQTSZ8WOR-rRouZsv3JDg1wrNOkeb/view?usp=drivesdk","youtubeTitle":"Dạy Con Biết Ơn Từ Những Điều Nhỏ Bé Để Thành Công Và Hạnh Phúc | #phuchocdieuhay","youtubeDesc":"Biết ơn không chỉ là lời nói, mà là sự trân trọng những hy sinh th       stEl.innerText = d ? "Đã đăng" : "Chưa đăng";

      var btnDone = document.getElementById("btnDoneToggle");
      btnDone.className = "btn btn-done-toggle " + (d ? "is-done" : "");
      btnDone.innerHTML = d ? "✅ ĐÃ ĐĂNG BÀI RỒI" : "⚪ Đánh Dấu: Đã Đăng";

      var mBox = document.getElementById("mediaBox");
      if (currentTab === "video") {
        mBox.innerHTML = '<div style="padding:24px 10px;text-align:center;color:#94a3b8;"><span style="font-size:36px;">🎬</span><br><b style="color:#fff;">Video: ' + (it.videoUrl ? "Sẵn sàng" : "Chưa có link Drive") + '</b><br><small style="color:#64748b;">Bấm "Mở Drive" bên dưới để tải hoặc xem MP4</small></div>';
      } else {
        var imgPreview = it.imageUrl || ("Image/A (" + it.stt + ").jpg");
        mBox.innerHTML = '<img src="' + imgPreview + '" onerror="this.src='logo.jpg'" onclick="openLightbox(this.src)" title="Bấm để phóng to">';
      }

      renderCopyButtons(it);
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    function renderCopyButtons(it) {
      var g = document.getElementById("copyGrid");
      if (currentTab === "video") {
        g.innerHTML = 
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].youtubeTitle, 'Tiêu đề YouTube')">📋 Tiêu Đề YT</button>' +
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].tiktok, 'Caption TikTok')">📋 TikTok</button>' +
          '<button class="btn-copy btn-fb" onclick="copyText(getItems()[' + currentIndex + '].facebook, 'Caption FB (Kèm Hashtag)')">📋 Caption FB (Kèm Hashtag)</button>' +
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].zalo, 'Caption Zalo')">📋 Caption Zalo</button>' +
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].youtubeDesc, 'Mô tả YouTube')">📋 Mô Tả YouTube</button>' +
          '<button class="btn-copy btn-pinned" onclick="copyText(getItems()[' + currentIndex + '].pinnedComment, 'Bình luận ghim')">📌 Bình Luận Ghim</button>';
      } else {
        g.innerHTML = 
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].title, 'Tiêu đề bài viết')">📋 Tiêu Đề Bài</button>' +
          '<button class="btn-copy btn-fb" onclick="copyText(getItems()[' + currentIndex + '].facebook, 'Bài Viết Facebook (Kèm Hashtag)')">📋 BÀI VIẾT FACEBOOK (Kèm Hashtag)</button>' +
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].zalo, 'Caption Zalo (Kèm Hashtag)')">📋 Caption Zalo</button>' +
          '<button class="btn-copy" onclick="copyText(getItems()[' + currentIndex + '].tiktok, 'Caption TikTok / Insta')">📋 TikTok / Insta</button>' +
          '<button class="btn-copy btn-pinned" onclick="copyText(getItems()[' + currentIndex + '].pinnedComment, 'Bình luận ghim thảo luận')">📌 Bình Luận Ghim Thảo Luận</button>' +
          '<button class="btn-copy" style="grid-column: span 2; background: rgba(6, 182, 212, 0.15); color: #22d3ee; border-color: rgba(6, 182, 212, 0.35);" onclick="copyText(getItems()[' + currentIndex + '].prompt, 'Prompt AI Tạo Ảnh')">🎨 Sao Chép Prompt AI</button>';
      }
    }

    function openDriveLink() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var link = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : (it.imageUrl || ("Image/A (" + it.stt + ").jpg"));
      if (link && link.indexOf("http") === 0) {
        window.open(link, "_blank");
      } else {
        showToast("⚠️ Link nội bộ hoặc chưa có URL Google Drive: " + link);
      }
    }

    function nextItem() {
      var items = getItems();
      if (currentIndex < items.length - 1) {
        currentIndex++;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đã đến bài cuối cùng!");
      }
    }

    function toggleCurrentDone() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var k = getItemKey(it);
      var currentDone = isDone(it);
      var newDone = !currentDone;
      doneStorage[k] = newDone;
      localStorage.setItem("phuc_done_items", JSON.stringify(doneStorage));

      loadCurrentItem();
      renderTable();
      updateStats();

      // Đồng bộ 2 chiều về Google Sheet
      if (WEB_APP_URL && WEB_APP_URL.indexOf("http") === 0) {
        var syncUrl = WEB_APP_URL + "?action=markPosted&type=" + currentTab + "&stt=" + it.stt + "&title=" + encodeURIComponent(it.title) + "&isDone=" + newDone;
        fetch(syncUrl, { mode: "no-cors" }).catch(function(){});
      }
      showToast(newDone ? "✅ Đã đánh dấu: ĐÃ ĐĂNG" : "⚪ Đã chuyển: CHƯA ĐĂNG");
    }

    function copyText(txt, label) {
      if (!txt) {
        showToast("⚠️ Chưa có nội dung " + label);
        return;
      }
      navigator.clipboard.writeText(txt).then(function() {
        showToast("✓ Đã chép: " + label);
      }).catch(function() {
        var t = document.createElement("textarea");
        t.value = txt;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        showToast("✓ Đã chép: " + label);
      });
    }

    function showToast(m) {
      var t = document.getElementById("toastMsg");
      t.innerText = m;
      t.style.display = "block";
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(function(){ t.style.display = "none"; }, 1800);
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll(".filter-chip").forEach(function(c){ c.classList.remove("active"); });
      btn.classList.add("active");
      renderTable();
    }

    function renderTable() {
      var q = (document.getElementById("searchInput").value || "").toLowerCase();
      var items = getItems();
      var tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      items.forEach(function(it, idx) {
        var d = isDone(it);
        if (currentFilter === "pending" && d) return;
        if (currentFilter === "done" && !d) return;
        if (q && it.title.toLowerCase().indexOf(q) === -1) return;

        var tr = document.createElement("tr");
        if (idx === currentIndex) tr.className = "active";
        tr.onclick = function() {
          currentIndex = idx;
          loadCurrentItem();
          renderTable();
        };

        var scorePrefix = (currentTab === "image" && it.score) ? ("⭐" + it.score + " ") : "";
        tr.innerHTML = 
          '<td><b>#' + it.stt + '</b></td>' +
          '<td>' + scorePrefix + it.title + '</td>' +
          '<td><span class="badge-status ' + (d ? "done" : "pending") + '">' + (d ? "Đã đăng" : "Chưa") + '</span></td>';
        tbody.appendChild(tr);
      });
    }

    function updateStats() {
      var items = getItems();
      var total = items.length;
      var doneCount = 0;
      items.forEach(function(it){ if (isDone(it)) doneCount++; });
      var pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById("statText").innerText = "Đã đăng: " + doneCount + " / " + total;
      document.getElementById("statPercent").innerText = pct + "%";
      document.getElementById("progressBar").style.width = pct + "%";
    }

    // Khởi động
    switchTab("video");
  </script>
</body>
</html>
