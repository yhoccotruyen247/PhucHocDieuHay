ue;      });      var dCount = RAW_ITEMS.filter(function(i){ return postedStorage[i.stt] || (i.status === "ĐÃ ĐĂNG"); }).length;      document.getElementById("cntAll").innerText = RAW_ITEMS.length;      document.getElementById("cntDone").innerText = dCount;      document.getElementById("cntPending").innerText = RAW_ITEMS.length - dCount;      if (list.length === 0) {        container.innerHTML = "<div style='text-align:center;color:#64748b;padding:30px;'>Không có bài viết nào</div>";        return;      }      container.innerHTML = list.map(function(item) {        var done = postedStorage[item.stt] || (item.status === "ĐÃ ĐĂNG");        var idx = item._idx !== undefined ? item._idx : RAW_ITEMS.indexOf(item);        return "<div class='card'>" +          "<div class='card-top'>" +            "<span class='badge-stt'>#" + item.stt + "</span>" +            "<span class='badge-status " + (done ? "status-done" : "status-pending") + "'>" + (done ? "✅ ĐÃ ĐĂNG" : "⏳ CHƯA ĐĂNG") + "</span>" +          "</div>" +          "<div class='card-title'>" + escapeHtml(item.title) + "</div>" +          "<div class='category-tag'>📁 " + escapeHtml(item.category) + "</div>" +          (item.videoUrl ? "<a href='" + encodeURI(item.videoUrl) + "' target='_blank' rel='noopener' class='btn-drive'>📥 Tải Video Từ Google Drive</a>" : "") +          "<div class='actions-grid'>" +            "<button class='btn-copy' data-idx='" + idx + "' data-field='tiktok'>🎵 Copy TikTok</button>" +            "<button class='btn-copy' data-idx='" + idx + "' data-field='facebook'>📘 Copy FB</button>" +            "<button class='btn-copy' data-idx='" + idx + "' data-field='youtubeTitle'>▶️ Tiêu đề YT</button>" +            "<button class='btn-copy' data-idx='" + idx + "' data-field='youtubeDesc'>📄 Mô tả YT</button>" +            "<button class='btn-copy' data-idx='" + idx + "' data-field='zalo'>💬 Copy Zalo</button>" +            "<button class='btn-copy' data-idx='" + idx + "' data-field='instagram'>📸 Copy Insta</button>" +          "</div>" +          (item.pinnedComment ? "<button class='btn-copy' style='width:100%' data-idx='" + idx + "' data-field='pinnedComment'>📌 Copy Bình Luận Ghim</button>" : "") +          "<button class='btn-mark-done " + (done ? "done" : "") + "' data-idx='" + idx + "'>" +            (done ? "✓ Đã Hoàn Thành (Bấm để hủy)" : "Đánh Dấu Đã Đăng Xong") +          "</button>" +        "</div>";      }).join("");    }    document.addEventListener("click", function(e) {      var btnCopy = e.target.closest(".btn-copy");      if (btnCopy) {        var idx = parseInt(btnCopy.getAttribute("data-idx"), 10);        var field = btnCopy.getAttribute("data-field");        copyField(idx, field);        return;      }      var btnDone = e.target.closest(".btn-mark-done");      if (btnDone) {        var idx = parseInt(btnDone.getAttribute("data-idx"), 10);        toggleDone(idx);        return;      }    });    RAW_ITEMS.forEach(function(item, i){ item._idx = i; });    renderList();  </script></body></html>
