 center;      justify-content: center;      gap: 12px;      margin-bottom: 6px;    }    .brand-avatar {      width: 48px;      height: 48px;      border-radius: 50%;      object-fit: cover;      border: 2px solid var(--primary);      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);      flex-shrink: 0;    }    /* HEADER */    header {      background: linear-gradient(180deg, rgba(245, 158, 11, 0.18) 0%, rgba(19, 27, 46, 0) 100%);      padding: 18px 16px 12px 16px;      text-align: center;      border-bottom: 1px solid var(--border);    }    .header-title {      font-size: 21px;      font-weight: 900;      background: linear-gradient(135deg, #fbbf24, #f97316);      -webkit-background-clip: text;      -webkit-text-fill-color: transparent;      letter-spacing: -0.3px;    }    .header-subtitle {      font-size: 11px;      color: var(--text-muted);      margin-top: 3px;    }    .stats-badge {      display: inline-flex;      align-items: center;      gap: 6px;      margin-top: 8px;      background: rgba(11, 17, 32, 0.8);      padding: 5px 14px;      border-radius: 20px;      font-size: 12.5px;      font-weight: 700;      color: #fbbf24;      border: 1px solid rgba(245, 158, 11, 0.3);    }    .progress-bar-bg {      width: 100%;      height: 6px;      background: rgba(255,255,255,0.08);      border-radius: 6px;      margin-top: 10px;      overflow: hidden;    }    .progress-bar-fill {      height: 100%;      background: linear-gradient(90deg, #f59e0b, #10b981);      width: 0%;      transition: width 0.3s ease;    }    /* CURRENT CARD (CHỈ HIỂN THỊ 1 VIDEO TẠI 1 THỜI ĐIỂM) */    .current-card {      margin: 14px 16px 8px 16px;      background: var(--card-inner);      border: 1px solid var(--border);      border-radius: 18px;      padding: 15px;      display: flex;      flex-direction: column;      gap: 10px;      box-shadow: 0 10px 25px rgba(0,0,0,0.3);    }    .current-header {      display: flex;      justify-content: space-between;      align-items: center;      gap: 8px;    }    .badge-stt {      font-size: 13px;      font-weight: 900;      background: rgba(245, 158, 11, 0.2);      color: #fbbf24;      padding: 4px 10px;      border-radius: 8px;      border: 1px solid rgba(245, 158, 11, 0.35);    }    .badge-category {      font-size: 11px;      font-weight: 700;      color: var(--text-muted);    }    .badge-status {      font-size: 11.5px;      font-weight: 800;      padding: 4px 10px;      border-radius: 8px;    }    .badge-status.done {      background: rgba(16, 185, 129, 0.2);      color: #34d399;      border: 1px solid rgba(52, 211, 153, 0.35);    }    .badge-status.pending {      background: rgba(245, 158, 11, 0.2);      color: #fbbf24;      border: 1px solid rgba(251, 191, 36, 0.35);    }    .current-title {      font-size: 16px;      font-weight: 800;      color: #fff;      line-height: 1.4;    }    /* ACTION BUTTONS */    .actions-wrap {      padding: 0 16px 12px 16px;      display: flex;      flex-direction: column;      gap: 10px;    }    .primary-btn-row {      display: grid;      grid-template-columns: 1fr 1fr;      gap: 10px;    }    .btn {      border: none;      outline: none;      border-radius: 12px;      padding: 12px 14px;      font-size: 13.5px;      font-weight: 800;      color: #fff;      cursor: pointer;      display: flex;      align-items: center;      justify-content: center;      gap: 6px;      transition: all 0.2s ease;      user-select: none;    }    .btn:active { transform: scale(0.97); }    .btn-next {      background: linear-gradient(135deg, #6366f1, #4f46e5);      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);    }    .btn-drive {      background: linear-gradient(135deg, #059669, #047857);      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);    }    .btn-done-toggle {      background: #1e293b;      border: 1px solid #334155;      color: #f8fafc;    }    .btn-done-toggle.is-done {      background: rgba(16, 185, 129, 0.2);      color: #34d399;      border-color: #10b981;    }    .btn-history {      background: #1e293b;      border: 1px solid #334155;      color: #cbd5e1;    }    /* COPY GRID */    .copy-grid {      display: grid;      grid-template-columns: 1fr 1fr;      gap: 8px;    }    .btn-copy {      background: #1e293b;      border: 1px solid #334155;      color: #f8fafc;      padding: 9px 8px;      border-radius: 10px;      font-size: 12px;      font-weight: 700;      cursor: pointer;      display: flex;      align-items: center;      justify-content: center;      gap: 5px;      transition: all 0.2s;    }    .btn-copy:active { transform: scale(0.96); background: var(--primary); color: #000; }    .btn-copy.btn-pinned { grid-column: span 2; }    /* LIST SECTION LIKE CreateHtml.js */    .list-section {      padding: 10px 16px 16px 16px;      border-top: 1px solid var(--border);      display: flex;      flex-direction: column;      gap: 10px;      background: rgba(11, 17, 32, 0.4);    }    .search-bar-wrap { position: relative; }    .search-input {      width: 100%;      background: #090d16;      border: 1px solid var(--border);      border-radius: 12px;      padding: 10px 14px 10px 36px;      font-size: 13px;      color: #fff;      outline: none;      transition: border-color 0.2s;    }    .search-input:focus { border-color: var(--primary); }    .search-icon {      position: absolute;      left: 12px;      top: 50%;      transform: translateY(-50%);      font-size: 14px;      color: var(--text-muted);    }    .filter-chips {      display: flex;      gap: 6px;      overflow-x: auto;      padding-bottom: 2px;    }    .chip {      background: #090d16;      color: var(--text-muted);      border: 1px solid var(--border);      font-size: 11.5px;      font-weight: 700;      padding: 5px 12px;      border-radius: 12px;      cursor: pointer;      white-space: nowrap;      transition: all 0.2s;    }    .chip.active {      background: var(--primary);      color: #000;      border-color: var(--primary);    }    .table-container {      background: #090d16;      border-radius: 14px;      border: 1px solid var(--border);      max-height: 260px;      overflow-y: auto;    }    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }    th {      position: sticky;      top: 0;      background: #1e293b;      padding: 8px 10px;      text-align: left;      font-size: 11px;      font-weight: 800;      color: var(--text-muted);      text-transform: uppercase;      z-index: 2;      border-bottom: 1px solid var(--border);    }    td {      padding: 8px 10px;      border-bottom: 1px solid rgba(255,255,255,0.04);      vertical-align: middle;    }    tr:hover { background: rgba(255,255,255,0.03); }    tr.selected { background: rgba(245, 158, 11, 0.12); }    .dot {      width: 9px; height: 9px; border-radius: 50%; background: #64748b; display: inline-block;    }    .dot.done { background: #10b981; box-shadow: 0 0 6px #10b981; }    .cell-actions { display: flex; gap: 4px; justify-content: flex-end; }    .btn-mini {      background: #1e293b;      border: 1px solid #334155;      color: #e2e8f0;      font-size: 11px;      font-weight: 700;      padding: 4px 8px;      border-radius: 6px;      cursor: pointer;    }    .btn-mini:hover { background: var(--primary); color: #000; }    /* MODAL FOR HISTORY */    .modal-overlay {      position: fixed; inset: 0; background: rgba(0,0,0,0.75);      backdrop-filter: blur(4px); z-index: 100; display: none;      align-items: center; justify-content: center; padding: 16px;    }    .modal-overlay.open { display: flex; }    .modal-card {      background: var(--card-bg); border: 1px solid var(--border);      border-radius: 20px; width: 100%; max-width: 440px; max-height: 80vh;      display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.5);    }    .modal-header {      padding: 14px 18px; display: flex; justify-content: space-between;      align-items: center; border-bottom: 1px solid var(--border);    }    .modal-title { font-size: 16px; font-weight: 800; color: #fbbf24; }    .modal-close {      background: none; border: none; color: var(--text-muted);      font-size: 24px; cursor: pointer; line-height: 1;    }    .modal-body {      padding: 14px 18px; overflow-y: auto; flex: 1;      display: flex; flex-direction: column; gap: 8px;    }    .history-item {      background: #090d16; border: 1px solid var(--border);      border-radius: 10px; padding: 10px; font-size: 12px;      display: flex; justify-content: space-between; align-items: center;    }    .history-time { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }    /* TOAST */    .toast {      position: fixed; bottom: 20px; left: 50%;      transform: translateX(-50%) translateY(100px);      background: #1e293b; border: 1px solid var(--primary); color: #fff;      padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: 700;      z-index: 200; transition: all 0.3s; opacity: 0;      box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: none;      max-width: 90vw; text-align: center;    }    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }  </style></head><body>  <div class="app-container">    <header>      <div class="brand-wrap">        <img src="Avatar.png" class="brand-avatar" alt="Avatar Phúc Học Điều Hay" onerror="if(this.src.indexOf('avatar.png')===-1)this.src='avatar.png'">        <div style="text-align: left;">          <div class="header-title">PHÚC HỌC ĐIỀU HAY</div>          <div class="header-subtitle">Trạm Đăng Video 5 Nền Tảng • 1 Chạm Tải & Sao Chép</div>        </div>      </div>      <div class="stats-badge" id="statsBadge">📊 Đang nạp dữ liệu...</div>      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>    </header>    <!-- CURRENT ACTIVE VIDEO CARD -->    <div class="current-card">      <div class="current-header">        <div style="display: flex; align-items: center; gap: 8px;">          <span class="badge-stt" id="currStt">#---</span>          <span class="badge-category" id="currC ='background:" + (done ? "#b91c1c" : "#047857") + "' data-stt='" + item.stt + "'>" + (done ? "Hủy" : "Xong") + "</button>" +            "</div>" +          "</td>";        tbody.appendChild(tr);      });    }    function renderHistory() {      var container = document.getElementById("historyList");      if (!postHistory || postHistory.length === 0) {        container.innerHTML = "<div style='text-align:center; color:var(--text-muted); padding:20px;'>Chưa có lịch sử đăng video</div>";        return;      }      container.innerHTML = postHistory.map(function(h) {        return "<div class='history-item'>" +          "<div>" +            "<div style='font-weight:700; color:#fff;'>#" + h.stt + " - " + h.title + "</div>" +            "<div class='history-time'>" + h.time + "</div>" +          "</div>" +          "<button class='btn-mini btn-history-reselect' data-stt='" + h.stt + "'>Xem lại</button>" +        "</div>";      }).join("");    }    /* EVENT LISTENERS */    document.getElementById("btnNext").onclick = function() {      var unposted = RAW_ITEMS.filter(function(i){ return !isItemDone(i); });      if (unposted.length === 0) {        showToast("🎉 Đã hoàn thành tất cả video!");        var nextIdx = 0;        if (currentProduct) {          var curIdx = RAW_ITEMS.findIndex(function(x){ return x.stt === currentProduct.stt; });          nextIdx = (curIdx + 1) % RAW_ITEMS.length;        }        selectProduct(RAW_ITEMS[nextIdx]);        return;      }      var nextItem = null;      if (currentProduct) {        nextItem = unposted.find(function(x){ return x.stt > currentProduct.stt; });      }      if (!nextItem) nextItem = unposted[0];      selectProduct(nextItem);      showToast("⏭️ Đã chuyển sang video #" + nextItem.stt);    };    /* Nút Tải Video Ngay: Kích hoạt tải trực tiếp */    document.getElementById("btnDrive").onclick = function() {      if (!currentProduct || !currentProduct.videoUrl) {        return showToast("⚠️ Không tìm thấy link video!");      }      var directUrl = getDirectDriveLink(currentProduct.videoUrl);      window.open(directUrl, "_blank");      showToast("📥 Đang kích hoạt tải video...");    };    document.getElementById("btnMarkDone").onclick = function() {      if (!currentProduct) return;      toggleDoneFor(currentProduct);    };    var historyModal = document.getElementById("historyModal");    document.getElementById("btnHistory").onclick = function() {      renderHistory();      historyModal.classList.add("open");    };    document.getElementById("btnCloseHistory").onclick = function() {      historyModal.classList.remove("open");    };    historyModal.onclick = function(e) {      if (e.target === historyModal) historyModal.classList.remove("open");    };    document.getElementById("btnClearHistory").onclick = function() {      if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử đăng?")) {        postHistory = []; saveState(); renderHistory(); showToast("🗑️ Đã xóa sạch lịch sử");      }    };    document.getElementById("searchInput").oninput = renderTable;    document.querySelectorAll(".filter-chips .chip").forEach(function(chip) {      chip.onclick = function() {        document.querySelectorAll(".filter-chips .chip").forEach(function(c){ c.classList.remove("active"); });        chip.classList.add("active");        currentFilter = chip.getAttribute("data-filter");        renderTable();      };    });    /* EVENT DELEGATION CHO NÚT BẤM SAO CHÉP & BẢNG */    document.addEventListener("click", function(e) {      var btnCopy = e.target.closest(".btn-copy");      if (btnCopy) {        if (!currentProduct) return showToast("⚠️ Chưa chọn video");        var field = btnCopy.getAttribute("data-field");        var label = FIELD_LABELS[field] || field;        copyText(currentProduct[field], label);        return;      }      var btnSel = e.target.closest(".btn-action-select");      if (btnSel) {        var stt = parseInt(btnSel.getAttribute("data-stt"), 10);        var p = RAW_ITEMS.find(function(x){ return x.stt === stt; });        if (p) selectProduct(p);        return;      }      var btnTgl = e.target.closest(".btn-action-toggle");      if (btnTgl) {        var stt = parseInt(btnTgl.getAttribute("data-stt"), 10);        var p = RAW_ITEMS.find(function(x){ return x.stt === stt; });        if (p) toggleDoneFor(p);        return;      }      var btnHistResel = e.target.closest(".btn-history-reselect");      if (btnHistResel) {        var stt = parseInt(btnHistResel.getAttribute("data-stt"), 10);        var p = RAW_ITEMS.find(function(x){ return x.stt === stt; });        if (p) {          historyModal.classList.remove("open");          selectProduct(p);        }        return;      }    });    /* KHỞI ĐỘNG */    updateStats();    var firstUnposted = RAW_ITEMS.find(function(i){ return !isItemDone(i); });    selectProduct(firstUnposted || RAW_ITEMS[0] || null);    renderTable();  </script></body></html>
