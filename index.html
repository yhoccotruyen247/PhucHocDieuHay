<!doctype html><html lang="vi"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">  <title>TRẠM ĐĂNG BÀI • PHÚC HỌC ĐIỀU HAY</title>  <link rel="preconnect" href="https://fonts.googleapis.com">  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">  <!-- Web App & Favicon Icons (Nhận diện Avatar.png có sẵn trên GitHub) -->  <link rel="icon" type="image/png" href="Avatar.png">  <link rel="shortcut icon" type="image/png" href="Avatar.png">  <link rel="apple-touch-icon" sizes="180x180" href="Avatar.png">  <link rel="apple-touch-icon" href="Avatar.png">  <meta name="apple-mobile-web-app-title" content="Phúc Học Điều Hay">  <meta name="apple-mobile-web-app-capable" content="yes">  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  <meta name="application-name" content="Phúc Học Điều Hay">  <meta name="theme-color" content="#090d16">  <style>    :root {      --bg: #090d16;      --card-bg: #131b2e;      --card-inner: #0b1120;      --text: #f8fafc;      --text-muted: #94a3b8;      --border: #1e293b;      --primary: #f59e0b;      --primary-hover: #d97706;      --success: #10b981;      --success-hover: #059669;      --danger: #ef4444;    }    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; display: flex; justify-content: center; }    .app-container {      width: 100%;      max-width: 520px;      background: var(--card-bg);      border-radius: 24px;      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);      overflow: hidden;      display: flex;      flex-direction: column;    }    /* BRAND & AVATAR */    .brand-wrap {      display: flex;      align-items: center;      justify-content: center;      gap: 12px;      margin-bottom: 6px;    }    .brand-avatar {      width: 48px;      height: 48px;      border-radius: 50%;      object-fit: cover;      border: 2px solid var(--primary);      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);      flex-shrink: 0;    }    /* HEADER */    header {      background: linear-gradient(180deg, rgba(245, 158, 11, 0.18) 0%, rgba(19, 27, 46, 0) 100%);      padding: 18px 16px 12px 16px;      text-align: center;      border-bottom: 1px solid var(--border);    }    .header-title {      font-size: 21px;      font-weight: 900;      background: linear-gradient(135deg, #fbbf24, #f97316);      -webkit-background-clip: text;      -webkit-text-fill-color: transparent;      letter-spacing: -0.3px;    }    .header-subtitle {      font-size: 11px;      color: var(--text-muted);      margin-top: 3px;    }    .stats-badge {      display: inline-flex;      align-items: center;      gap: 6px;      margin-top: 8px;      background: rgba(11, 17, 32, 0.8);      padding: 5px 14px;      border-radius: 20px;      font-size: 12.5px;      font-weight: 700;      color: #fbbf24;      border: 1px solid rgba(245, 158, 11, 0.3);    }    .progress-bar-bg {      width: 100%;      height: 6px;      background: rgba(255,255,255,0.08);      border-radius: 6px;      margin-top: 10px;      overflow: hidden;    }    .progress-bar-fill {      height: 100%;      background: linear-gradient(90deg, #f59e0b, #10b981);      width: 0%;      transition: width 0.3s ease;    }    /* CURRENT CARD (CHỈ HIỂN THỊ 1 VIDEO TẠI 1 THỜI ĐIỂM) */    .current-card {      margin: 14px 16px 8px 16px;      background: var(--card-inner);      border: 1px solid var(--border);      border-radius: 18px;      padding: 15px;      display: flex;      flex-direction: column;      gap: 10px;      box-shadow: 0 10px 25px rgba(0,0,0,0.3);    }    .current-header {      display: flex;      justify-content: space-between;      align-items: center;      gap: 8px;    }    .badge-stt {      font-size: 13px;      font-weight: 900;      background: rgba(245, 158, 11, 0.2);      color: #fbbf24;      padding: 4px 10px;      border-radius: 8px;      border: 1px solid rgba(245, 158, 11, 0.35);    }    .badge-category {      font-size: 11px;      font-weight: 700;      color: var(--text-muted);    }    .badge-status {      font-size: 11.5px;      font-weight: 800;      padding: 4px 10px;      border-radius: 8px;    }    .badge-status.done {      background: rgba(16, 185, 129, 0.2);      color: #34d399;      border: 1px solid rgba(52, 211, 153, 0.35);    }    .badge-status.pending {      background: rgba(245, 158, 11, 0.2);      color: #fbbf24;      border: 1px solid rgba(251, 191, 36, 0.35);    }    .current-title {      font-size: 16px;      font-weight: 800;      color: #fff;      line-height: 1.4;    }    /* ACTION BUTTONS */    .actions-wrap {      padding: 0 16px 12px 16px;      display: flex;      flex-direction: column;      gap: 10px;    }    .primary-btn-row {      display: grid;      grid-template-columns: 1fr 1fr;      gap: 10px;    }    .btn {      border: none;      outline: none;      border-radius: 12px;      padding: 12px 14px;      font-size: 13.5px;      font-weight: 800;      color: #fff;      cursor: pointer;      display: flex;      align-items: center;      justify-content: center;      gap: 6px;      transition: all 0.2s ease;      user-select: none;    }    .btn:active { transform: scale(0.97); }    .btn-next {      background: linear-gradient(135deg, #6366f1, #4f46e5);      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);    }    .btn-drive {      background: linear-gradient(135deg, #059669, #047857);      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);    }    .btn-done-toggle {      background: #1e293b;      border: 1px solid #334155;      color: #f8fafc;    }    .btn-done-toggle.is-done {      background: rgba(16, 185, 129, 0.2);      color: #34d399;      border-color: #10b981;    }    .btn-history {      background: #1e293b;      border: 1px solid #334155;      color: #cbd5e1;    }    /* COPY GRID */    .copy-grid {      display: grid;      grid-template-columns: 1fr 1fr;      gap: 8px;    }    .btn-copy {      background: #1e293b;      border: 1px solid #334155;      color: #f8fafc;      padding: 9px 8px;      border-radius: 10px;      font-size: 12px;      font-weight: 700;      cursor: pointer;      display: flex;      align-items: center;      justify-content: center;      gap: 5px;      transition: all 0.2s;    }    .btn-copy:active { transform: scale(0.96); background: var(--primary); color: #000; }    .btn-copy.btn-pinned { grid-column: span 2; }    /* LIST SECTION LIKE CreateHtml.js */    .list-section {      padding: 10px 16px 16px 16px;      border-top: 1px solid var(--border);      display: flex;      flex-direction: column;      gap: 10px;      background: rgba(11, 17, 32, 0.4);    }    .search-bar-wrap { position: relative; }    .search-input {      width: 100%;      background: #090d16;      border: 1px solid var(--border);      border-radius: 12px;      padding: 10px 14px 10px 36px;      font-size: 13px;      color: #fff;      outline: none;      transition: border-color 0.2s;    }    .search-input:focus { border-color: var(--primary); }    .search-icon {      position: absolute;      left: 12px;      top: 50%;      transform: translateY(-50%);      font-size: 14px;      color: var(--text-muted);    }    .filter-chips {      display: flex;      gap: 6px;      overflow-x: auto;      padding-bottom: 2px;    }    .chip {      background: #090d16;      color: var(--text-muted);      border: 1px solid var(--border);      font-size: 11.5px;      font-weight: 700;      padding: 5px 12px;      border-radius: 12px;      cursor: pointer;      white-space: nowrap;      transition: all 0.2s;    }    .chip.active {      background: var(--primary);      color: #000;      border-color: var(--primary);    }    .table-container {      background: #090d16;      border-radius: 14px;      border: 1px solid var(--border);      max-height: 260px;      overflow-y: auto;    }    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }    th {      position: sticky;      top: 0;      background: #1e293b;      padding: 8px 10px;      text-align: left;      font-size: 11px;      font-weight: 800;      color: var(--text-muted);      text-transform: uppercase;      z-index: 2;      border-bottom: 1px solid var(--border);    }    td {      padding: 8px 10px;      border-bottom: 1px solid rgba(255,255,255,0.04);      vertical-align: middle;    }    tr:hover { background: rgba(255,255,255,0.03); }    tr.selected { background: rgba(245, 158, 11, 0.12); }    .dot {      width: 9px; height: 9px; border-radius: 50%; background: #64748b; display: inline-block;    }    .dot.done { background: #10b981; box-shadow: 0 0 6px #10b981; }    .cell-actions { display: flex; gap: 4px; justify-content: flex-end; }    .btn-mini {      background: #1e293b;      border: 1px solid #334155;      color: #e2e8f0;      font-size: 11px;      font-weight: 700;      padding: 4px 8px;      border-radius: 6px;      cursor: pointer;    }    .btn-mini:hover { background: var(--primary); color: #000; }    /* MODAL FOR HISTORY */    .modal-overlay {      position: fixed; inset: 0; background: rgba(0,0,0,0.75);      backdrop-filter: blur(4px); z-index: 100; display: none;      align-items: center; justify-content: center; padding: 16px;    }    .modal-overlay.open { display: flex; }    .modal-card {      background: var(--card-bg); border: 1px solid var(--border);      border-radius: 20px; width: 100%; max-width: 440px; max-height: 80vh;      display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.5);    }    .modal-header {      padding: 14px 18px; display: flex; justify-content: space-between;      align-items: center; border-bottom: 1px solid var(--border);    }    .modal-title { font-size: 16px; font-weight: 800; color: #fbbf24; }    .modal-close {      background: none; border: none; color: var(--text-muted);      font-size: 24px; cursor: pointer; line-height: 1;    }    .modal-body {      padding: 14px 18px; overflow-y: auto; flex: 1;      display: flex; flex-direction: column; gap: 8px;    }    .history-item {      background: #090d16; border: 1px solid var(--border);      border-radius: 10px; padding: 10px; font-size: 12px;      display: flex; justify-content: space-between; align-items: center;    }    .history-time { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }    /* TOAST */    .toast {      position: fixed; bottom: 20px; left: 50%;      transform: translateX(-50%) translateY(100px);      background: #1e293b; border: 1px solid var(--primary); color: #fff;      padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: 700;      z-index: 200; transition: all 0.3s; opacity: 0;      box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: none;      max-width: 90vw; text-align: center;    }    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }  </style></head><body>  <div class="app-container">    <header>      <div class="brand-wrap">        <img src="Avatar.png" class="brand-avatar" alt="Avatar Phúc Học Điều Hay" onerror="if(this.src.indexOf('avatar.png')===-1)this.src='avatar.png'">        <div style="text-align: left;">          <div class="header-title">PHÚC HỌC ĐIỀU HAY</div>          <div class="header-subtitle">Trạm Đăng Video 5 Nền Tảng • 1 Chạm Tải & Sao Chép</div>        </div>      </div>      <div class="stats-badge" id="statsBadge">📊 Đang nạp dữ liệu...</div>      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>    </header>    <!-- CURRENT ACTIVE VIDEO CARD -->    <div class="current-card">      <div class="current-header">        <div style="display: flex; align-items: center; gap: 8px;">          <span class="badge-stt" id="currStt">#---</span>          <span class="badge-category" id="currCategory">📁 ---</span>        </div>        <span class="badge-status pending" id="currStatusBadge">⏳ Chưa đăng</span>      </div>      <div class="current-title" id="currTitle">Đang nạp video...</div>    </div>    <!-- ACTION BUTTONS -->    <div class="actions-wrap">      <div class="primary-btn-row">        <button class="btn btn-next" id="btnNext"><span>⏭️</span> Video Tiếp</button>        <button class="btn btn-drive" id="btnDrive"><span>📥</span> Tải Video Ngay</button>      </div>      <div class="primary-btn-row">        <button class="btn btn-done-toggle" id="btnMarkDone">          <span id="markDoneIcon">✅</span> <span id="markDoneText">Đánh Dấu Đã Đăng</span>        </button>        <button class="btn btn-history" id="btnHistory"><span>📜</span> Lịch Sử</button>      </div>      <div class="copy-grid">        <button class="btn-copy" data-field="tiktok">🎵 Copy TikTok</button>        <button class="btn-copy" data-field="facebook">📘 Copy FB</button>        <button class="btn-copy" data-field="youtubeTitle">▶️ Tiêu đề YT</button>        <button class="btn-copy" data-field="youtubeDesc">📄 Mô tả YT</button>        <button class="btn-copy" data-field="zalo">💬 Copy Zalo</button>        <button class="btn-copy" data-field="instagram">📸 Copy Insta</button>        <button class="btn-copy btn-pinned" id="btnPinnedComment" data-field="pinnedComment" style="display:none;">📌 Copy Bình Luận Ghim</button>      </div>    </div>    <!-- VIDEO LIST & SEARCH SECTION (GIỐNG CreateHtml.js) -->    <div class="list-section">      <div class="search-bar-wrap">        <span class="search-icon">🔍</span>        <input type="text" class="search-input" id="searchInput" placeholder="Tìm theo STT (#1) hoặc từ khóa...">      </div>      <div class="filter-chips">        <div class="chip active" data-filter="pending">⏳ Chưa đăng (<span id="countPending">0</span>)</div>        <div class="chip" data-filter="done">✅ Đã đăng (<span id="countDone">0</span>)</div>        <div class="chip" data-filter="all">Tất cả (<span id="countAll">0</span>)</div>      </div>      <div class="table-container">        <table>          <thead>            <tr>              <th style="width: 32px;">TT</th>              <th style="width: 50px;">STT</th>              <th>Tiêu Đề Video</th>              <th style="width: 95px; text-align: right;">Hành động</th>            </tr>          </thead>          <tbody id="tableBody"></tbody>        </table>      </div>    </div>  </div>  <!-- HISTORY MODAL -->  <div class="modal-overlay" id="historyModal">    <div class="modal-card">      <div class="modal-header">        <div class="modal-title">📜 Lịch Sử Đã Đăng</div>        <button class="modal-close" id="btnCloseHistory">&times;</button>      </div>      <div class="modal-body" id="historyList">        <div style="text-align:center; color:var(--text-muted); padding:20px;">Chưa có lịch sử</div>      </div>      <div style="padding: 10px 18px; border-top: 1px solid var(--border);">        <button class="btn btn-history" id="btnClearHistory" style="padding: 8px 12px; font-size: 12px; width: 100%;">          🗑️ Xóa Lịch Sử        </button>      </div>    </div>  </div>  <div id="toastMsg" class="toast"></div>  <script>    var RAW_ITEMS = [{"stt":1,"category":"Phúc học cách sống","title":"Biết cúi đầu xin lỗi khi mình làm sai","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1Y7SoVQrTdExDcTidO_g3tTWHXN-Zv4_m/view?usp=drivesdk","youtubeTitle":"Dạy Trẻ Biết Xin Lỗi Khi Làm Sai: Bài Học Về Sự Dũng Cảm Và Trung Thực | #phuchocdieuhay","youtubeDesc":"Trong cuộc sống, ai cũng có lúc mắc sai lầm. Thay vì trốn tránh hay đổ lỗi, hãy dạy con cách dũng cảm đối diện và nói lời xin lỗi chân thành. Video từ kênh Phúc Học Điều Hay gửi gắm thông điệp về sự trung thực và trách nhiệm. Biết nhận lỗi không làm con thấp kém, mà giúp con trưởng thành và đáng tin cậy hơn. Mong rằng cha mẹ sẽ cùng con lan tỏa sự tử tế này. Hãy nhấn Subscribe để cùng con học thêm nhiều điều hay mỗi ngày nhé!\n\n#ph n "";      var match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);      if (match && match[1]) {        return "https://drive.google.com/uc?export=download&id=" + match[1];      }      return url;    }    function copyText(text, label) {      if (!text) return showToast("⚠️ Không có " + label);      if (navigator.clipboard && navigator.clipboard.writeText) {        navigator.clipboard.writeText(text).then(function(){          showToast("📋 Đã copy " + label);        }).catch(function(){ fallbackCopy(text, label); });      } else {        fallbackCopy(text, label);      }    }    function fallbackCopy(text, label) {      var ta = document.createElement("textarea");      ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";      document.body.appendChild(ta); ta.focus(); ta.select();      try {        document.execCommand("copy"); showToast("📋 Đã copy " + label);      } catch(e) { showToast("❌ Không thể copy"); }      document.body.removeChild(ta);    }    function selectProduct(p) {      currentProduct = p;      if (!p) {        document.getElementById("currStt").innerText = "#---";        document.getElementById("currCategory").innerText = "📁 ---";        document.getElementById("currStatusBadge").innerText = "Chưa chọn video";        document.getElementById("currStatusBadge").className = "badge-status pending";        document.getElementById("currTitle").innerText = "Không có video nào khả dụng";        document.getElementById("btnPinnedComment").style.display = "none";        return;      }      var done = isItemDone(p);      document.getElementById("currStt").innerText = "#" + p.stt;      document.getElementById("currCategory").innerText = "📁 " + p.category;      document.getElementById("currTitle").innerText = p.title;      var statusBadge = document.getElementById("currStatusBadge");      statusBadge.innerText = done ? "✅ Đã đăng" : "⏳ Chưa đăng";      statusBadge.className = "badge-status " + (done ? "done" : "pending");      var markDoneBtn = document.getElementById("btnMarkDone");      if (done) {        markDoneBtn.classList.add("is-done");        document.getElementById("markDoneIcon").innerText = "↩️";        document.getElementById("markDoneText").innerText = "Đã Xong (Bấm để hủy)";      } else {        markDoneBtn.classList.remove("is-done");        document.getElementById("markDoneIcon").innerText = "✅";        document.getElementById("markDoneText").innerText = "Đánh Dấu Đã Đăng";      }      var pinnedBtn = document.getElementById("btnPinnedComment");      if (p.pinnedComment) pinnedBtn.style.display = "flex";      else pinnedBtn.style.display = "none";      renderTable();    }    function updateStats() {      var total = RAW_ITEMS.length;      var doneCount = RAW_ITEMS.filter(function(i){ return isItemDone(i); }).length;      var percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;      document.getElementById("statsBadge").innerHTML = "📊 Đã đăng " + doneCount + "/" + total + " video (" + percent + "%)";      document.getElementById("progressBar").style.width = percent + "%";      document.getElementById("countAll").innerText = total;      document.getElementById("countDone").innerText = doneCount;      document.getElementById("countPending").innerText = total - doneCount;    }    function toggleDoneFor(item) {      if (!item) return;      var wasDone = isItemDone(item);      var isDone = !wasDone;      postedStorage[item.stt] = isDone;      if (isDone) {        item.status = "Đã đăng";        var now = new Date();        var timeStr = now.toLocaleDateString("vi-VN") + " " + now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });        postHistory.unshift({ stt: item.stt, title: item.title, time: timeStr });        if (postHistory.length > 50) postHistory.pop();      } else {        item.status = "Đã làm video";      }      saveState();      updateStats();      if (currentProduct && currentProduct.stt === item.stt) {        selectProduct(item);      }      renderTable();      showToast(isDone ? "✅ Đã đánh dấu ĐÃ ĐĂNG!" : "⏳ Đã chuyển thành CHƯA ĐĂNG");      if (WEB_APP_URL) {        var sendUrl = WEB_APP_URL + (WEB_APP_URL.indexOf("?") === -1 ? "?" : "&") + "action=markPosted&stt=" + encodeURIComponent(item.stt) + "&isDone=" + isDone + "&_t=" + Date.now();        fetch(sendUrl, { mode: "no-cors" }).catch(function(){});        fetch(WEB_APP_URL, {          method: "POST", mode: "no-cors",          headers: { "Content-Type": "text/plain;charset=utf-8" },          body: JSON.stringify({ action: "markPosted", stt: item.stt, title: item.title, isDone: isDone })        }).catch(function(){});      }    }    function renderTable() {      var tbody = document.getElementById("tableBody");      tbody.innerHTML = "";      var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();      var filtered = RAW_ITEMS.filter(function(item) {        var done = isItemDone(item);        if (currentFilter === "pending" && done) return false;        if (currentFilter === "done" && !done) return false;        if (q) {          var matchStt = ("#" + item.stt).toLowerCase() === q || String(item.stt) === q;          var matchTitle = (item.title || "").toLowerCase().indexOf(q) !== -1;          return matchStt || matchTitle;        }        return true;      });      if (filtered.length === 0) {        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:#64748b; padding:20px;'>Không có video nào phù hợp</td></tr>";        return;      }      filtered.forEach(function(item) {        var done = isItemDone(item);        var isSelected = currentProduct && currentProduct.stt === item.stt;        var tr = document.createElement("tr");        if (isSelected) tr.className = "selected";        tr.innerHTML = "<td><span class='dot " + (done ? "done" : "") + "'></span></td>" +          "<td><strong>#" + item.stt + "</strong></td>" +          "<td><div style='font-weight:700; max-width:210px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>" + item.title + "</div></td>" +          "<td style='text-align:right;'>" +            "<div class='cell-actions'>" +              "<button class='btn-mini btn-action-select' data-stt='" + item.stt + "'>" + (isSelected ? "Đang xem" : "Xem") + "</button>" +              "<button class='btn-mini btn-action-toggle' style='background:" + (done ? "#b91c1c" : "#047857") + "' data-stt='" + item.stt + "'>" + (done ? "Hủy" : "Xong") + "</button>" +            "</div>" +          "</td>";        tbody.appendChild(tr);      });    }    function renderHistory() {      var container = document.getElementById("historyList");      if (!postHistory || postHistory.length === 0) {        container.innerHTML = "<div style='text-align:center; color:var(--text-muted); padding:20px;'>Chưa có lịch sử đăng video</div>";        return;      }      container.innerHTML = postHistory.map(function(h) {        return "<div class='history-item'>" +          "<div>" +            "<div style='font-weight:700; color:#fff;'>#" + h.stt + " - " + h.title + "</div>" +            "<div class='history-time'>" + h.time + "</div>" +          "</div>" +          "<button class='btn-mini btn-history-reselect' data-stt='" + h.stt + "'>Xem lại</button>" +        "</div>";      }).join("");    }    /* EVENT LISTENERS */    document.getElementById("btnNext").onclick = function() {      var unposted = RAW_ITEMS.filter(function(i){ return !isItemDone(i); });      if (unposted.length === 0) {        showToast("🎉 Đã hoàn thành tất cả video!");        var nextIdx = 0;        if (currentProduct) {          var curIdx = RAW_ITEMS.findIndex(function(x){ return x.stt === currentProduct.stt; });          nextIdx = (curIdx + 1) % RAW_ITEMS.length;        }        selectProduct(RAW_ITEMS[nextIdx]);        return;      }      var nextItem = null;      if (currentProduct) {        nextItem = unposted.find(function(x){ return x.stt > currentProduct.stt; });      }      if (!nextItem) nextItem = unposted[0];      selectProduct(nextItem);      showToast("⏭️ Đã chuyển sang video #" + nextItem.stt);    };    /* Nút Tải Video Ngay: Kích hoạt tải trực tiếp */    document.getElementById("btnDrive").onclick = function() {      if (!currentProduct || !currentProduct.videoUrl) {        return showToast("⚠️ Không tìm thấy link video!");      }      var directUrl = getDirectDriveLink(currentProduct.videoUrl);      window.open(directUrl, "_blank");      showToast("📥 Đang kích hoạt tải video...");    };    document.getElementById("btnMarkDone").onclick = function() {      if (!currentProduct) return;      toggleDoneFor(currentProduct);    };    var historyModal = document.getElementById("historyModal");    document.getElementById("btnHistory").onclick = function() {      renderHistory();      historyModal.classList.add("open");    };    document.getElementById("btnCloseHistory").onclick = function() {      historyModal.classList.remove("open");    };    historyModal.onclick = function(e) {      if (e.target === historyModal) historyModal.classList.remove("open");    };    document.getElementById("btnClearHistory").onclick = function() {      if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử đăng?")) {        postHistory = []; saveState(); renderHistory(); showToast("🗑️ Đã xóa sạch lịch sử");      }    };    document.getElementById("searchInput").oninput = renderTable;    document.querySelectorAll(".filter-chips .chip").forEach(function(chip) {      chip.onclick = function() {        document.querySelectorAll(".filter-chips .chip").forEach(function(c){ c.classList.remove("active"); });        chip.classList.add("active");        currentFilter = chip.getAttribute("data-filter");        renderTable();      };    });    /* EVENT DELEGATION CHO NÚT BẤM SAO CHÉP & BẢNG */    document.addEventListener("click", function(e) {      var btnCopy = e.target.closest(".btn-copy");      if (btnCopy) {        if (!currentProduct) return showToast("⚠️ Chưa chọn video");        var field = btnCopy.getAttribute("data-field");        var label = FIELD_LABELS[field] || field;        copyText(currentProduct[field], label);        return;      }      var btnSel = e.target.closest(".btn-action-select");      if (btnSel) {        var stt = parseInt(btnSel.getAttribute("data-stt"), 10);        var p = RAW_ITEMS.find(function(x){ return x.stt === stt; });        if (p) selectProduct(p);        return;      }      var btnTgl = e.target.closest(".btn-action-toggle");      if (btnTgl) {        var stt = parseInt(btnTgl.getAttribute("data-stt"), 10);        var p = RAW_ITEMS.find(function(x){ return x.stt === stt; });        if (p) toggleDoneFor(p);        return;      }      var btnHistResel = e.target.closest(".btn-history-reselect");      if (btnHistResel) {        var stt = parseInt(btnHistResel.getAttribute("data-stt"), 10);        var p = RAW_ITEMS.find(function(x){ return x.stt === stt; });        if (p) {          historyModal.classList.remove("open");          selectProduct(p);        }        return;      }    });    /* KHỞI ĐỘNG */    updateStats();    var firstUnposted = RAW_ITEMS.find(function(i){ return !isItemDone(i); });    selectProduct(firstUnposted || RAW_ITEMS[0] || null);    renderTable();  </script></body></html>
